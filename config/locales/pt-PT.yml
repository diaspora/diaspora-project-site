      finish1: Muito obrigado por ler este guia de iniciação! Nós esperamos que este
        lhe tenha sido útil e que agora se sinta confortável em utilizar o diaspora*
        como a sua nova página principal on-line. Se tiver quaisquer questões, sinta-se
        à vontade para as colocar publicamente no diaspora*, incluindo as etiquetas
        <span class="click">#help</span> e <span class="click">#question</click>,
        e assim os membros de outras comunidades podem tentar ajudá-lo. Por essa Internet
        existe uma comunidade excelente e colaboradora!
      finish2: Se tiver quaisquer questões que ainda não foram respondidas, fique
        à vontade para colocar uma publicação pública no diaspora*, incluindo as etiquetas
