  pages:
    index:
      headline: Bem-vindo ao diaspora*
      byline: O mundo social na Internet onde tem um controlo total
      register: Registar »
      key_philosophies: 'diaspora* é baseado em três chaves filosóficas:'
      decentralization: Descentralização
      decentralization_about: Em vez de todos os dados serem mantidos em grandes servidores
        centrais pertencentes a uma grande organização, o diáspora* existe nos servidores
        ("pods") independentes em todo o mundo. Você escolhe qual o servidor para
        se registar, e pode ligar-se perfeitamente com a comunidade diáspora* em todo
        o mundo.
      freedom: Liberdade
      freedom_about: Você pode ser quem desejar no diaspora*. Ao contrário das outras
        redes, não precisa de utilizar a sua identidade real. Pode interagir com qualquer
        pessoa à sua escolha e como o desejar. O único limite é a sua imaginação.
        diaspora* é também um Software Livre, dando-lhe liberdade para o utilizar
        como o desejar.
      privacy: Privacidade
      privacy_about: No diáspora* é o dono dos seus próprios dados. Não está a conceder
        os direitos a uma empresa ou outros interesses que os poderiam utilizar. Além
        disso, escolhe quem vê o que você partilha, utilizando os «Círculos». Com
        o diáspora *, os seus amigos, os seus hábitos e o seu conteúdo são seus ...
        não nossos!
      get_started: Pretende iniciar-se?
      get_started_sub: É tão simples como, 1, 2, 3 ...
      choose_pod: 1. Escolha um servidor
      choose_pod_exp:
      host_yourself:
      sign_up: 2. Registar
      sign_up_ex: Assim que tiver decidido qual o servidor correto para si, baseado
        nas classificações e informação em %{poduptime}, e talvez as recomendações
        das pessoas que confia, registe-se lá e crie um perfil com a informação pessoal
        que desejar. Está em controle sobre o que pretende partilhar.
      join_convo: 3. Junte-se à conversa!
      join_convo_ex: 'Comece a seguir algumas #tags relacionadas com os seus interesses:
        isto poderá ser <span class="click">#music</span> (#música), <span class="click">#photography</span>,
        <span class="click">#privacy</span> (#privacidade) ou <span class="click">#linux</span>
        - seja qual for o seu desejo. Partilhe uma mensagem pública com a etiqueta
        <span class="click">#newhere</span> (#novoaqui) para se introduzir, e já está.
        Agora já faz parte da comunidade vibrante do diaspora*.'
      aspects: Círculos
      aspects_ex: diaspora* é pioneiro no conceito de círculos, o que significa que
        pode organizar os seus contactos de acordo com o que eles representam na sua
        vida. Isto significa que pode partilhar qualquer coisa apenas com os membros
        familiares ou colegas de trabalho, sabendo que ninguém que você não deseja
        irá poder ver o que publica.
      features: Funções
      features_ex: Hashtags dão~lhe a liberdade para sinalizar e seguir facilmente
        os seus interesses. Pode chamar a atenção das pessoas @mencionando-as. Volte
        a partilhar as publicações que gosta, e assim, os outros podem desfrutar e
        também comentá-las. E mostre a sua admiração pelo trabalho das outras pessoas,
        gostando (♥).
      help: Pretende ajudar?
      help_ex: diáspora* precisa de pessoas para escreverem e testarem o código, receber
        e ajudar os novos membros, configurar e manter os servidores da comunidade,
        e divulgarem os benefícios do diáspora* às outras pessoas que possam querer
        participar. Acha que gostaria de contribuir para o projeto?
      earth_alt: Earthd*
      decentralized_alt: Descentralizado
      freedom_alt: Liberdade
      keyhole_alt: Privado
      aspects_alt: Círculos
      features_alt: Funções
      ways_to_help_alt: Modos para ajudar
    about:
      headline: Como é que o diaspora* funciona?
      byline: diaspora* é simples para utilizar – aqui tem como
      menu_title: Sobre
      decentralize: O que é a descentralização?
      decentralize_ex: Diaspora* é completamente diferente da maioria das redes que
        utiliza. Este é completamente descentralizado, sem um "portal" (''hub'') central.
        Ainda assim, é muito fácil para se ligar e comunicar com as pessoas. Veja
        como.
      this: ISTO
      this_ex: diaspora* é uma rede verdadeira, sem nenhuma base central. Existem
        servidores (chamados de ''pods'') em todo o mundo, contendo os dados de todos
        os utilizadores que optaram por se registar neles. Estes servidores comunicam
        facilmente uns com os outros, de modo que pode registar-se em qualquer um
        e comunicar livremente com os seus contactos, onde quer que eles estejam na
        rede.
      notthis: ISTO NÃO
      notthis_ex: A maior parte das redes sociais são geridas em servidores centralizados,
        controladas e geridas por corporações. Estas guardam todos os dados privados
        de todos os seus utilizadores. Esta informação pode ser perdida ou piratiada,
        e tal como qualquer sistema com um 'bottleneck', qualquer problema nos servidores
        centrais pode fazer com que toda a rede fique muito lenta, ou nem por isso.
        E também é muito fácil para os governos as “vigiarem.”
      discl: "(diaspora* utiliza os padrões da Web aberta, tais como, %{pubsubhubbub}
        e %{webfinger} para tornar este tipo de ligação possível.)"
      connect: Como é que eu ligo?
      connect_ex: 'Embora o diáspora* seja composto por muitos servidores por todo
        o mundo, irá senti-lo como uma rede integrada. Não precisa de estar no mesmo
        servidor que os seus contactos para poder comunicar-se livremente com cada
        um - a comunicação ocorre perfeitamente em todos os servidores do universo
        do diáspora*. Ao utilizar o diáspora*, pode facilmente esquecer que na verdade
        é composto de muitos servidores. Ligar-se com alguém do diáspora* é realmente
        muito simples:'
      find: 1. Encontre-os
      find_ex: Tudo o que precisa de fazer para se ligar a alguém é encontrá-los e
        adicioná-los num círculo. (Veja em baixo para saber mais sobre os círculos).
        Encontre-os utilizando o campo de pesquisa na barra preta, ou passe o rato
        sobre o nome no seu fluxo e irá aparecer um 'cartão sobreposto. Se conhece
        a Id. do diaspora* (seunome@podname.com), pode utilizar esse.
      add: 2. Adicione-os
      add_ex: 'Depois basta clicar em "Adicionar Contacto" e escolha o círculo que
        pretende que as pessoas façam parte. Agora já está ligado e pode partilhar
        com elas da maneira que faria em qualquer outra rede. Ou, se elas pertencem
        a diferentes círculos da sua vida, adicione-as a múltiplos círculos. Agora,
        já está ligado. É tão simples. '
      freedom: Liberdade
      freedom_byline: O diaspora* não tenta limitá-lo
      fdm1: Seja quem pretende ser
      fdm1_ex: Muitas das redes insistem em que utilize a sua identidade real. Não
        no diaspora*. Aqui, pode escolher quem deseja ser, e partilhar muito ou pouco
        sobre si mesmo, como o desejar. Tudo depende de si, e do quanto pretende interagir
        com as outras pessoas.
      fdm2: Seja criativo
      fdm2_ex: Não está limitado sobre como interagir. Pode seguir apenas pessoas
        que o fascinam para ver o que eles têm a dizer, ou pode partilhar a palavra
        com toda a gente. Partilhe as suas fotografias, trabalhos de arte, vídeos,
        música, palavras - o que desejar. Seja livre.
      fdm3: Livre como em liberdade
      fdm3_ex: diaspora* é um Software completamente Livre. Isto significa, que não
        existem limites em como este pode ser utilizado. E até pode utilizar o código
        fonte e alterá-lo do modo que desejar, e ajudar-nos a melhorar a rede. Nós
        adorávamos tê-lo a bordo!
      privacy: Privacidade
      privacy_byline: 'Controlo total sobre o que é seu '
      priv1: Seja dono dos seus próprios dados
      priv1_ex: Muitas redes ganham dinheiro, analisando as suas interações e utilizam
        isto para publicitar coisas para si. A diáspora* não utiliza os seus dados
        para qualquer propósito além de permitir que se ligue e partilhe com os outros.
        Somente os administradores de servidores com os quais interage podem aceder
        aos seus dados, e você pode escolher quais os servidores com que vai interagir.
      priv2: Seja o anfitrião
      priv2_ex: Escolha onde os seus dados são guardados, escolhendo um servidor com
        o qual está satisfeito. Se quer estar realmente seguro, pode configurar e
        hospedar o seu próprio servidor nos servidores que você controla, e interagir
        apenas com servidores em que confia, para que ninguém possa obter os seus
        dados pessoais.
      priv3: Escolha a sua audiência
      priv3_ex: Os círculos do diaspora* permitem-lhe partilhar com as apenas pessoas
        que desejar. Tanto pode ser como público ou como privado. Partilhe uma fotografia
        engraçada com todo o mundo, ou um segredo profundo com apenas os seus amigos
        mais chegados. Tem um controlo total.
      aspects: Tudo sobre os círculos
      aspects_byline: A chave para a privacidade no diaspora*
      asp1: Círculos da sua vida
      asp1_ex: A sua vida é composta de muitos círculos diferentes, envolvendo pessoas
        diferentes. Por que é que a sua vida ''on-line'' deveria ser diferente? Com
        os aspetos do diaspora* pode organizar a sua vida on-line tanto quanto o desejar
        e partilhar coisas apenas com as pessoas que pretender.
      asp2: Organize a sua vida
      asp2_ex: Por exemplo, poderá ter círculos para a sua família, para os seus amigos
        mais chegados, para colegas de trabalho e para desporto ou um passatempo que
        esteja envolvido. Os seus colegas de trabalho não precisam de saber sobre
        a sua família, será que precisam? Com os círculos, eles não sabem.
      asp3: Conte ao mundo
      asp3_ex: Claro, algumas coisas são tão importantes que quer contar a todo o
        mundo. Pode partilhar facilmente algo com todo o mundo, tornando-o público.
        Ao utilizar as "hashtags" apropriadas significa que vai chegar até às pessoas
        que provavelmente irão gostar disso.
      features: Funcionalidades que a nossa comunidade adora
      features_byline: Nós pensamos que também as vai adorar
      hashtags: Hashtags
      hashtags_ex: As "hashtags" permitem-lhe marcar e seguir os seus interesses,
        e ajudar as suas publicações a chegar às pessoas. Estas também são uma boa
        maneira para se divertir e conhecer novas pessoas e interessantes, no diaspora*.
      reshare: Voltar a Partilhar
      reshare_ex: Porque não voltar a partilhar uma publicação que gostou com os outros?
        O diaspora* torna fácil a divulgação de ideias através desta opção. Basta
        clicar no botão para partilhar a mensagem.
      mentions: Menções
      mentions_ex: Deseja chamar a atenção de alguém? Basta @mencioná-los! É uma forma
        fácil para alertar um dos seus contactos quando achar que há algo que eles
        deviam saber.
      love: Amor
      love_ex: Mostre o seu apreço por algo que gosta, gostando (♥). Porque ás vezes
        as palavras não são suficientes para dizer o que sente.
      host: Hospede um servidor comunitário
      host_byline: Seja uma das estrelas do diaspora*
      host_ex: diáspora* depende dos seus membros da comunidade para hospedar e executar
        servidores abertos a qualquer pessoa que queira participar. Se tiver algum
        espaço no servidor e um pouco de conhecimento técnico, nós adoraríamos que
        configurasse um servidor aberto para registos. Quanto mais servidores, melhor
        o diáspora* funciona - faça parte do futuro da rede social descentralizada!
      hostinst1: Consulte as %{instructions_link}, e configure o seu próprio servidor
        comunitário.
      instructions_link_text: Instruções da instalação do servidor
      hostinst2: Veja uma lista de servidores comunitários em %{poduptime}
      distributed_network: Rede distribuída
      centralized_network: Rede centralizada
      search_alt: Procurar
      add_a_contact_alt: Adicionar um contacto
      hashtag_alt: Hashtag
      reshare_alt: Voltar a Partilhar
      mention_alt: Mencionar
      heart_alt: Coração
    get_involved:
      headline: Participe!
      byline: O futuro da Web social começa consigo
      menu_title: Participe!
      community: Gerido pela comunidade
      community_byline: O diaspora* pertence-lhe
      meaning: O que é que isto tudo significa?
      meaning_ex1: Software Livre, é sobre individualidade, transparência, criatividade,
        e destino. É sobre ter uma ideia, e torná-la realidade. diaspora* foi fundado
        para preencher uma paixão pelo divertimento, e tornar a Internet num lugar
        melhor. Software Livre, é o que nos permite alterar o mudo para nós mesmos,
        e deixar que os nossos amigos na Web beneficiem da nossa exploração.
      meaning_ex2: As comunidades de Software Livre são coisas incríveis. No diáspora*,
        nós acreditamos que as pessoas devem ser valorizadas pelo que fazem. Não importa
        se é um programador de elite ou se nunca contribuiu para um projeto. Contribuir
        para o diáspora* significa que começa a trabalhar em problemas difíceis, com
        foco em soluções que funcionem para os utilizadores.
      meaning_ex3: É por isso que se contribuir com algo significativo para o diáspora*,
        nós iremos proporcionar-lhe acesso principal de confirmação. Nós estamos nisto
        juntos, e nós queremos dar às pessoas empolgadas a possibilidade de fazer
        grandes alterações.
      whereyou: Onde pode ajudar
      whereyou_ex1: Nós todos fazemos o diáspora*. Talvez ainda não o conheçamos,
        mas nós gostaríamos de conhecê-lo e descobrir como pode se integrar na equipa
        que está a criar o futuro da Web. Todos nós temos o potencial para mudar o
        mundo, dada a oportunidade certa.
      whereyou_ex2: A contribuição para o diáspora* vem em todas as formas e tamanhos
        diferentes. Seja um utilizador a ajudar-nos a encontrar erros, fornecendo
        ''feedback'' sobre as nossas listas de discussão ou contribuindo com código
        ou desenho, nós precisamos de si.
      gi_header: Modos sobre como se envolver com o diaspora*
      code_header: Contribuir com código
      code_byline: É simples a obtenção do código fonte.
      code_ex1: Clone o repositório e e vá até %{clone_code}
      code_ex2: Instale o seu ambiente de desenvolvimento
      code_ex3: Começar a contribuir com código!
      code_ex4: Nós temos uma grande comunidade pronta para o ajudar a começar. Nós
        sugerimos que consulte o nosso %{get_started_guide_link}, fale connosco no
        %{discourse_link}, e venha conhecer-nos na %{irc_link}.
