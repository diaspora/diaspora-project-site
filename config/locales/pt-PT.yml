      code_gh: Consultar a fonte no GitHub
      bugs_header: Reduzir erros
      bugs_ex1: O nosso projeto utiliza o «Code Triage», um serviço voluntário onde
        os utilizadores e os programadores podem trabalhar juntos para resolver os
        erros no nosso %{github_link}.
      bugs_ex2: Reduzindo os pequenos erros ajuda-nos a todos, e isto pode dar a um
        recém-chegado uma melhor perceção de como as partes do diaspora* funcionam.
      bugs_ex3: Ajude-nos a melhorar o nosso código
      github_link_text: Rastreador de Problemas do GitHub
      translate_header: Ajude na tradução
      translate_ex1: Pode ajudar-nos a traduzir o diaspora* para outros idiomas, juntando-se
