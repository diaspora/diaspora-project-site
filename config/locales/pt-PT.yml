      intro:
      settings: Gestão de Conta
      settings_ex1:
      settings_ex2: 'Existem cinco separadores na páginas das definições da conta:
        <strong>Perfil</strong>, <strong>Conta</strong>, <strong>Privacidade</strong>,
        <strong>Serviços</strong> e <strong>Aplicações</strong>.'
      profile: Perfil
      profile_ex1: Nesta página pode alterar, adicionar ou eliminar qualquer informação
        do seu perfil. Vá para o fim de %{part_link} se pretender um lembrete em como
        o editar. Não se esqueça de clicar no botão <span class="click">Atualizar</span>
        no fim, assim que tiver terminado!
      nsfw: '"Não é seguro para o trabalho" (NSFW)'
      profile_ex2: diáspora* possui um padrão comunitário autónomo chamado de NSFW
        (não é seguro para o trabalho). Se é provável que publique muito material
        que talvez não seja adequado para todo mundo ver na sua secretária de trabalho
        (talvez com o chefe atrás deles), marque a caixa NSFW. Isto irá ocultar as
        suas publicações dos fluxos das pessoas atrás de um aviso de que a publicação
        está marcada como NSFW. Depois eles podem clicar neste aviso para ver a sua
        publicação, se assim o desejarem.
      profile_ex3: Ao deixar esta caixa sem marcação, compromete-se a não publicar
        nenhum material que possa causar ofensa ou causar problemas a alguém por vê-lo
        no trabalho. Se, por outro lado, desejar publicar tal material apenas ocasionalmente,
        poderá deixar esta caixa desmarcada e adicionar a etiqueta <span class="click">#nsfw</span>
        para aquelas publicações individuais, que serão ocultadas para os fluxos dessas
        pessoas.
