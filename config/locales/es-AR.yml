  pages:
    index:
      headline: Bienvenid@ a diaspora*
      byline: La red social Libre donde tú tienes el control
      register: Regístrate
      key_philosophies: 'diaspora* se basa en tres filosofías claves:'
      decentralization: Descentralización
      decentralization_about: En lugar de tener la información de todos contenida
        en enormes servidores centrales que son propiedad de una gran empresa, servidores
        locales (llamados "pods") pueden instalarse en cualquier parte del mundo.
        Tú eliges en cuál "pod" registrarte para poder conectarte de manera fluida
        con la comunidad de diaspora* alrededor del mundo.
      freedom: Libertad
      freedom_about: Puedes ser quien tú quieras ser en diaspora*. A diferencia de
        otras redes, no tienes que usar tu identidad real. Puedes interactuar con
        quien quieras de la manera que quieras. El único límite es tu imaginación.
        diaspora* también es Software Libre, dándote la libertad de usarlo como desees.
      privacy: Privacidad
      privacy_about: En diaspora* tú eres dueño de tu información. No tienes que renunciar
        a ningún derecho ante una empresa u otros intereses que pudieran utilizarla.
        Además, tu eliges quién puede ver lo que compartís usando los Aspectos. ¡Con
        diaspora* tus amigos, tus hábitos y lo que compartís es tuyo... no nuestro!
      get_started: "¿Quieres empezar?"
      get_started_sub: Es tan fácil como el "abc"...
      choose_pod: 1. Elige un pod
      choose_pod_exp: Encuentra un "pod" justo para ti. Puedes preferir un "pod" pequeño,
        o uno que esté cerca de donde vives, o quizás en un país con buenas políticas
        de seguridad de datos. ¡La elección es tuya! Escoge entre nuestra comunidad
        de "pods".
      host_yourself: instala tu propio pod
      sign_up: 2. Regístrate
      sign_up_ex: Una vez que hayas decidido qué pod es el más adecuado para ti, basado
        en los ratings, en la información que hay en %{poduptime} y en recomendaciones
        de personas de confianza, regístrate y crea un perfil con cuanta información
        personal desees. Tú tienes el control de cuánto quieres compartir.
      join_convo: 3. ¡Únete a la conversación!
      join_convo_ex: 'Pudes comenzar siguiendo algunas #etiquetas relacionadas a tus
        intereses: puede ser <span class="click">#música</span>, <span class="click">#fotografía</span>,
        <span class="click">#privacidad</span> o <span class="click">#linux</span>
        - lo que más te guste. Comparte un mensaje público con las etiquetas <span
        class="click">#hola y #newhere</span> para presentarte, y diviértete. Ya eres
        parte de la fascinante comunidad de diaspora*.'
      aspects: Aspectos
      aspects_ex: diaspora* es pionera en el concepto de aspectos, que quiere decir
        que puedes organizar tus contactos de acuerdo al papel que juegan en tu vida.
        Tú eliges compartir algo sólo con familiares o colegas del trabajo sabiendo
        que nadie que no quieras podrá ver lo que publicas.
      features: Características
      features_ex: Las etiquetas te dan la libertad de etiquetar y seguir tus intereses
        con facilidad. Podés llamar la atención de la gente @mencionándolos. Vuelve
        a compartir las publicaciones que amas para que otros puedan disfrutar y comentar
        en ellas también. Y muestra el amor que sientes por el trabajo de otras personas
        haciendo clic en "Me gusta".
      help: "¿Deseas ayudar?"
      help_ex: diaspora* necesita personas que escriban y prueben el código, den la
        bienvenida y ayuden a los nuevos usuarios, instalen y mantengan pods comunitarios,
        y corran la voz sobre los beneficios de diaspora* a otros que quieran formar
        parte. ¿Te gustaría contribuir al proyecto?
      earth_alt: Planetad*
      decentralized_alt: Descentralizado
      freedom_alt: Libertad
      keyhole_alt: Cerradura
      aspects_alt: Aspectos
      features_alt: Características
      ways_to_help_alt: Maneras en que podés ayudar
    about:
      headline: "¿Cómo funciona diaspora*?"
      byline: diaspora* es fácil de usar. He aquí cómo.
      menu_title: Acerca de
      decentralize: "¿Qué es la descentralización?"
      decentralize_ex: diaspora* es completamente diferente de la mayoría de las redes
        que conocés. Es descentralizada, o sea, sin un "nodo" central. Aún así, es
        muy fácil conectarse y comunicarse con la gente. Así es como se hace.
      this: ESTO
      this_ex: diaspora* es una verdadera red, sin un nodo central. Hay servidores
        (llamados "pods") por todo el mundo, cada uno conteniendo los datos de los
        usuarios que han escogido registrarse en él. Estos pods se comunican entre
        sí de forma transparente, tal que puedes registrarte con cualquier pod y comunicarte
        libremente con tus contactos, sin importar en qué pod se encuentren.
      notthis: ESTO NO
      notthis_ex: La mayoría de las redes sociales funcionan desde servidores centrales
        pertenecientes a una empresa. Éstas almacenan todos los datos privados de
        sus usuarios. Esta información puede perderse o ser hackeada, y como con cualquier
        sistema con un cuello de botella, cualquier problema en los servidores centrales
        puede hacer que la red funcione muy lentamente, o que deje de hacerlo. Es
        también mucho más fácil para los gobiernos "escucharlas".
      discl: "(diaspora* usa estándares web abiertos como %{pubsubhubbub} y %{webfinger}
        para hacer posible este tipo de conexiones.)"
      connect: "¿Cómo me conecto?"
      connect_ex: 'Aunque diaspora* se compone de muchos "pods" alrededor del mundo,
        uno la percibe como una sola red integrada. No necesitas estar en el mismo
        "pod" que tus contactos para que se puedan comunicar libremente el uno con
        el otro - la comunicación ocurre transparentemente a través de todos los "pods"
        en el universo de diaspora*. Cuando la usás, a uno se le puede olvidar fácilmente
        que está compuesta de muchos servidores. Conectarse con alguien en diaspora*
        es en realidad algo muy simple: '
      find: 1. Encuéntralos
      find_ex: Todo lo que necesitás hacer para conectarte con alguien es encontrarlo
        y agregarlo a un "aspecto". (Leer más adelante para saber más sobre los "aspectos".)
        Para encontrarlo podés utilizar el campo de búsqueda en la barra de encabezado,
        o coloca el puntero sobre su nombre en tu Entrada y aparecerá una tarjeta
        flotante. Si conocés su identificación en diaspora* (tunombre@nombreDelPod.com),
        podés usarla.
      add: 2. Agrégalos
      add_ex: 'Entonces es sólo cuestión de hacer clic en el botón "Agregar contacto"
        y elegir en qué aspecto deseás que formen parte. Ahora están conectados y
        podés compartir con ellos tal como lo harías en cualquier otra red. O, si
        forman parte de diferentes aspectos en tu vida, agrégalos a aspectos múltiples.
        Es tan sencillo como eso. '
      freedom: Libertad
      freedom_byline: diaspora* no intenta limitarte
      fdm1: Sé quien quieras ser
      fdm1_ex: Muchas redes insisten en que usés tu identidad real. diaspora* no.
        Aquí tú puedes elegir quién quieres ser y compartir tanto o tan poco sobre
        vos como tú quieras. Realmente depende de ti cómo deseás interactuar con otras
        personas.
      fdm2: Sé creativo
      fdm2_ex: No estás limitado en tu manera de interactuar. Puedes simplemente seguir
        a personas fascinantes para ver que es lo que tienen que decir, o compartir
        con todo el mundo. Comparte tus fotos, dibujos, videos, música, palabras -
        lo que tu quieras. Déjate volar.
      fdm3: Libre de verdad
      fdm3_ex: diaspora* es totalmente Software Libre. Esto significa que no hay límites
        en cómo puede ser utilizado. Incluso puedes tomar el código fuente y cambiarlo
        para hacerlo funcionar de la manera que tu quieras y ayudarnos a mejorar la
        red. Nos encantaría tenerte a bordo.
      privacy: Privacidad
      privacy_byline: 'Control total sobre lo que es tuyo '
      priv1: Sé el dueño de tus datos
      priv1_ex: Muchas redes utilizan tus datos para hacer dinero analizando tus interacciones
        y usando esa información para enviarte publicidad. diaspora* sólo usa tus
        datos con el único propósito que permitir que te conectes y compartas con
        otros. Únicamente los administradores de pods pueden acceder a tus datos,
        y tú puedes elegir con qué pod interactuar.
      priv2: Alójalo tú mismo
      priv2_ex: Elige donde se almacenan tus datos eligiendo un "pod" con el que estés
        a gusto. Si quieres estar seguro de verdad, puedes configurar y alojar tu
        propio "pod" en servidores que tú controles, para que nadie pueda acceder
        a tus datos personales.
      priv3: Elige tu audiencia
      priv3_ex: Los "aspectos" de diaspora* te permiten compartir contenido solamente
        con las personas que quieras. Podés ser tan público o privado como quieras.
        Compartí una foto graciosa con el mundo entero, o un secreto con tus amigos
        más cercanos. ¡Tú tienes el control!
      aspects: Todo acerca de los "aspectos"
      aspects_byline: La clave de la privacidad en diaspora*
      asp1: Aspectos de tu vida
      asp1_ex: Tu vida está hecha de muchos aspectos diferentes que involucran a personas
        diferentes. ¿Por qué online debería ser diferente? Con los aspectos de diaspora*
        podés organizar tu vida en línea tanto como quieras y compartir cosas solo
        con las personas que tú quieras.
      asp2: Organiza tu vida
      asp2_ex: Por ejemplo, podrías tener "aspectos" para tu familia, para tus amigos
        más cercanos, para colegas del trabajo y para algún deporte o hobby que practiques.
        Tus colegas del trabajo no necesitan saber de tu reunión familiar, ¿o sí?
        Con los "aspectos" no lo sabrán.
      asp3: Díselo al mundo entero
      asp3_ex: Por supuesto, algunas cosas son tan importantes que querrás decirlas
        a todo el mundo. Podés compartir fácilmente con todo el mundo marcándolas
        para que sean públicas. Si usas las etiquetas (hashtags) adecuadas, les llegará
        a las personas a quienes posiblemente les interese.
      features: Características que nuestra comunidad ama
      features_byline: Creemos que también te va a encantar
      hashtags: Etiquetas
      hashtags_ex: Las etiquetas te permiten marcar y seguir tus intereses, y ayudan
        a que tus publicaciones alcancen a personas afines. También son una gran manera
        de conocer gente interesante y divertida en diaspora*.
      reshare: Volver a compartir
      reshare_ex: ¿Por qué no re-compartir una publicación que te gusta con otros?
        diaspora* hace fácil esparcir ideas por medio del "compartir". Sólo presiona
        el botón para volver a compartir el mensaje.
      mentions: Menciones
      mentions_ex: ¿Deseás su atención? ¡Sólo menciónalo con "@"! Es una forma de
        alertar a uno o varios de tus contactos de algo que estás pensando y que deben
        saberlo.
      love: Amor
      love_ex: Muestra tu aprecio por algo que te gusta con ♥. Porque algunas veces
        las palabras simplemente no son suficientes para decir lo que sientes.
      host: Aloja un "pod" comunitario
      host_byline: Sé una de las estrellas de diaspora*
      host_ex: diaspora* depende de los miembros de su comunidad para alojar y correr
        "pods" que estén abiertos a cualquiera que quiera participar. Si tienes un
        poco de espacio de servidor y un poco de conocimiento técnico, nos encantaría
        que configurases un "pod" que esté abierto para recibir personas que se quieran
        registrar. Mientras más "pods" haya, diaspora* funcionará mejor - ¡sé parte
        del futuro de la web social descentralizada!
      hostinst1: Lée las %{instructions_link} para configurar tu propio pod comunitario.
      instructions_link_text: Instrucciones para la instalación de pods
      hostinst2: Ver un listado de pods comunitarios en %{poduptime}
      distributed_network: Red distribuida
      centralized_network: Red centralizada
      search_alt: Buscar
      add_a_contact_alt: Añade un contacto
      hashtag_alt: Etiqueta
      reshare_alt: Compartir
      mention_alt: Mención
      heart_alt: Corazón
    get_involved:
      headline: "¡Participa!"
      byline: El futuro de la web social empieza con vos
      menu_title: Participa
      community: Hecho posible por la Comunidad
      community_byline: diaspora* te pertenece
      meaning: "¿Qué significa todo esto?"
      meaning_ex1: El Software Libre se trata de transparencia, creatividad y destino.
        Se trata de tener una idea y hacerla realidad. diaspora* fue fundada para
        saciar una pasión por divertirse y de paso hacer de Internet un mejor lugar.
        El Software Libre es lo que nos permite cambiar el mundo para el beneficio
        de todos y de nuestros amigos alrededor de la web.
      meaning_ex2: Las comunidades del Software Libre son algo asombroso. En diaspora*
        creemos que la gente debería ser valorada por lo que hace. No importa si eres
        un programador de élite o si no has contribuido nunca antes a un proyecto.
        Contribuir a diaspora* significa que estás dispuesto a trabajar en problemas
        difíciles, centrándote en soluciones que funcionen para los usuarios.
      meaning_ex3: Por lo que si aportas algo significativo a diaspora* te daremos
        pleno acceso al núcleo. Estamos en esto juntos, y queremos dar a la gente
        entusiasmada la oportunidad de hacer grandes cambios.
      whereyou: Donde entras tú
      whereyou_ex1: Todos hacemos diaspora*. Tal vez aún no sabemos quién eres, pero
        nos encantaría conocerte y averiguar cómo puedes ajustarte al equipo que está
        construyendo el futuro de la web social. Todos nosotros tenemos el potencial
        de cambiar el mundo si tenemos la oportunidad.
      whereyou_ex2: Hay muchas formas de contribuir a diaspora*. Tanto si eres un
        usuario que nos ayuda a detectar errores, como si aportas comentarios en nuestras
        listas de correo o contribuyes con código o diseño, te necesitamos.
      gi_header: Maneras de involucrarse en diaspora*
      code_header: Contribuye al código
      code_byline: Obtener el código fuente es sencillo
      code_ex1: 'Cloná el repositorio y curioseá: %{clone_code}'
      code_ex2: Instala tu entorno de desarrollo
      code_ex3: "¡Empieza a aportar código!"
      code_ex4: Ya tenemos una gran comunidad preparada para ayudarte a empezar. Te
        sugerimos revisar nuestra %{get_started_guide_link}, unirte a nuestro %{discourse_link}
        y venir a conocernos al %{irc_link}.
      get_started_guide_link_text: Guía para comenzar
      discourse_link_text: Foro de discusión y soporte
      irc_link_text: Sala de IRC de diaspora*
      code_gh: Mira la fuente en GitHub
      bugs_header: Manejo de errores
      bugs_ex1: Nuestro proyecto utiliza Code Triage, un servicio de voluntariado
        donde usuarios y desarrolladores pueden colaborar para solucionar errores
        en nuestro %{github_link}.
      bugs_ex2: Corregir pequeños errores beneficia a todos y puede proporcionar a
        un recién llegado un mejor conocimiento práctico de cómo funcionan partes
        de diaspora*.
      bugs_ex3: Ayúdanos a limpiar nuestro código
      github_link_text: Rastreador de Problemas de Github
      translate_header: Ayuda a traducir
      translate_ex1: Puedes ayudar a traducir diaspora* a otros lenguajes uniéndote
        a %{translations_link}
      translations_link_text: Grupo de Traducciones
      translate_ex2: Lée nuestras %{translation_instructions_link} para saber cómo
        empezar.
      translation_instructions_link_text: 'Instrucciones para traducir '
      voice_header: Aporta tu voz
      voice_ex1: Nuestro proyecto es gestionado en su totalidad por voluntarios de
        la comunidad. Utilizamos una herramienta llamada Discourse para conversar
        y debatir con nuestros colaboradores sobre ideas y propuestas.
      voice_ex2: Únete a nosotros allí
      voice_ex3: Convence a tus amigos y familiares de unirse a diaspora* organizando
        tu propio encuentro presencial de diaspora* %{meetup_link} en tu comunidad.
      meetup_link_text: Encuentro
      support_header: Proporciona soporte
      support_ex1: "¡Ayuda a los nuevos usuarios a sentirse bienvenidos!"
      support_ex2: Regístrate aquí
      support_ex3: Escribe tutoriales para los usuarios en la sección %{tutorials_link}.
      support_ex4: Responde a las preguntas de los usuarios en nuestro %{irc_channel_link}
        o en la propia plataforma de diaspora* siguiendo las etiquetas <span class="click">#ayuda</span>,
        <span class="click">#pregunta</span> y <span class="click">#feedback</span>.
      irc_channel_link_text: Canal IRC
      support_ex5: Contribuir a %{wiki_link}.
      wiki_link_text: wiki de diaspora*
      run_header: Mantener un pod público
      run_ex1: Ahora no tienes que conformarte con tener tus datos en el servidor
        de otra persona. Dado que diaspora* es software totalmente libre, trabajamos
        continuamente para facilitar que los usuarios %{host_pod_link}.
      host_pod_link_text: alojar pods propios en diaspora*
      run_ex2: Puedes alojarlo donde tú quieras.
      run_ex3: Agrega tu pod al listado en %{poduptime}
      contributors_header: Contribuyentes a diaspora*
      contributors_byline: La gente que hace de diaspora* lo que es
