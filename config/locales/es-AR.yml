        información.
      subscribe_headline: Suscribir
      subscribe: Puedes mantenerte al día suscribiéndote al %{feed_link} del planeta.
      feed_link_title: Feed Atom
      subscriptions_headline: Suscripciones
    community_guidelines:
      headline: Principios sociales
      byline: Pautas para formar parte de la comunidad de diaspora*
      menu_title: Principios sociales
      statement1: diaspora* ofrece a cualquier persona (sin importar su edad, talla,
        discapacidad, etnia, identidad y expresión de género, nivel de experiencia,
        nacionalidad, apariencia física, raza, religión u orientación e identidad
        sexual) la oportunidad de conectarse en una red social descentralizada. Para
        que todos disfrutemos de la mejor experiencia posible en diaspora*, aspiramos
        a una comunidad que interactúe con respeto.
      statement2: el concepto de red descentralizada de diaspora* no permite vetar
        a los miembros. Por ello, una interacción respetuosa, basada en los ideales
        de la comunidad de diaspora*, resulta fundamental para el bienestar de esta
        red.
      statement3: Como comunidad de diaspora*, nos unimos contra cualquier tipo de
        discriminación y exclusión. No aceptamos comunicaciones basadas en principios
        de chovinismo y nacionalismo. Rechazamos las declaraciones racistas y la minimización
        de la violencia fascista, tanto histórica como actual. Nos oponemos a cualquier
        forma de exclusión y a la violencia estructural y física asociada a ella.
      be_excellent: "¡Mantener la calma y ser excelentes los unos con los otros!"
      howto: "¿Cómo hacer esto?"
      howto_language: Utiliza un lenguaje acogedor e inclusivo.
      howto_viewpoints_experiences: Sé respetuoso con los diferentes puntos de vista
        y experiencias.
      howto_constructive_criticism: Acepta con elegancia las críticas constructivas.
      howto_empathy: Muestra empatía hacia otros miembros de la comunidad.
      howto_sexualized_language: Evita el lenguaje y las imágenes de carácter sexual
        o violento, y no prestes atención sexual no deseada ni hagas insinuaciones.
      howto_troll: No hagas trolling, no publiques comentarios insultantes o despectivos,
        ni ataques a otros miembros de la comunidad.
      howto_harassment: "¡No acoses a las personas, ni en público ni en privado!"
      howto_benefit_of_doubt: Concede a los demás el beneficio de la duda. Podrías
        estar interpretando erróneamente lo que han dicho.
    tutorials:
      headline: tutoriales de diaspora*
      byline: Guías paso a paso para ayudarte
      menu_title: Tutoriales
      tutorials_ex1: Bienvenido a la sección de tutoriales de diaspora*. En esta página
        encontrarás un resumen de todos nuestros tutoriales de diaspora*, divididos
        en una serie de "Primeros pasos" y tutoriales independientes para tareas específicas.
        Si eres nuevo en diaspora* o aún no te has registrado, te recomendamos leer
        la serie de "Primeros pasos". Si buscas opciones adicionales, echa un vistazo
        al resto de los tutoriales.
      tutorials_ex2: Hacemos todo lo posible por mantener estos tutoriales actualizados
        con las últimas novedades de diaspora*. Por lo tanto, tenga en cuenta que
        su pod podría no estar ejecutando la última versión de diaspora*, lo que podría
        resultar en un comportamiento diferente al descrito en nuestros tutoriales.
        Encuentre su pod en %{podup_link} para ver qué versión del software está ejecutando.
      started_head: Comenzando en diaspora*
      started1: Regístrate
      started2: La interfaz
      started3: Aspectos
      started4: Busca y conéctate con personas
      started5: "¡Empieza a compartir!"
