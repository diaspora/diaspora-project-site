    planet:
      headline: El planeta diaspora*
      subline: artículos del blog de nuestra comunidad
      menu_title: Planeta
      disclaimer_headline: El planeta diaspora*
      disclaimer: El planeta diaspora* es una recopilación de artículos escritos por
        miembros de nuestra comunidad y refleja las opiniones de dichos miembros a
        título individual. La propiedad de todas las publicaciones pertenece a sus
