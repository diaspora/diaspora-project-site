  pages:
    index:
      headline: Te damos la bienvenida a diaspora*
      byline: El mundo social en línea donde tú tienes el control
      register: Regístrate
      key_philosophies: 'diaspora* se basa en tres filosofías claves:'
      decentralization: Descentralización
      decentralization_about: En lugar de que los datos de todos se encuentren en
        los servidores enormes de una gran corporación, diaspora* usa servidores independientes
        («cápsulas») instalades en todo el mundo. Se puede elegir en cuál cápsula
        se desea registrarse y conectarse sin interrupciones con la comunidad de diaspora*
        alrededor del mundo.
      freedom: Libertad
      freedom_about: Puedes elegir ser quien quieras ser en diaspora*. A diferencia
        de otras redes, no es necesario usar tu identidad real. Puedes interactuar
        con la gente de la manera en la que prefieras, pero el único límite es tu
        imaginación. Además diaspora* es un software libre, por lo que te da libertad
        de usarlo como gustes.
      privacy: Privacidad
      privacy_about: En diaspora* tú manejas tus datos. Aquí no debes cederle los
        derechos de tus datos a ninguna corporación u otra entidad que pueda usarlos.
        Además, eliges quién puede ver lo que compartes por medio de las facetas.
        Así que, en diaspora*, tus amigos, tus hábitos y tu contenido son completamente
        tuyos... ¡no nuestros!
      get_started: "¿Quieres empezar?"
      get_started_sub: Es tan fácil como contar hasta 3.
      choose_pod: 1. Elije una cápsula
      choose_pod_exp: 'Encuentra una cápsula que se acomode a ti, ya sea una pequeña,
        que esté cerca tuyo o en un país que consideres que tenga buenas políticas
        de seguridad de datos, o que permita publicar en varias redes sociales externas
        a la vez (como Twitter)... ¡la elección es tuya! O también aloja una cápsula
        en: %{host_yourself_link}, si tienes conocimientos en administración de sistemas.'
      host_yourself:
      sign_up: 2. Regístrate
      sign_up_ex: Cuando hayas decidido qué cápsula te sirve según las calificaciones
        y la información en %{poduptime}, e incluso según las recomendaciones de tus
        personas de confianza, regístrate y crea un perfil con solo la información
        que quieras proveer. Porque estás en control de lo que compartes.
      join_convo: 3. ¡Únete a la conversación!
      join_convo_ex: '¡Empieza a seguir las etiquetas de tu interés!: <span class="click">#música</span>,
        <span class="click">#fotografía</span>, <span class="click">#privacidad</span>
        o <span class="click">#linux</span>. Lo que sea que te guste. Publica con
        la etiqueta <span class="click">#hola</span> para presentarte y ¡listo! Ya
        serás parte de la fascinante comunidad de diaspora*.'
      aspects: Facetas
      aspects_ex: diaspora* es pionera en el concepto de facetas. Con ellas puedes
        organizar tus contactos de acuerdo con su papel en tu vida. Así compartes
        solo con la familia o los compañeros del trabajo con todo el conocimiento
        de que solo lo verán las personas que no quieras.
      features: Características
      features_ex: 'Las etiquetas dan la libertad de catalogar y seguir los intereses
        con facilidad: llama la atención de alguien @mencionándolo o comparte publicaciones
        que te gustaron para que otros también las puedan disfrutar y comentar. Asimismo,
        muestra tu amor al trabajo de otros dándole al ♥.'
      help: "¿Quieres ayudar?"
      help_ex: En diaspora* necesitamos escribir y probar el código, bienvenir y ayudar
        a los nuevos miembros, ajustar y mantener las cápsulas y correr la palabra
        acerca de los beneficios de diaspora* con otros que quisieran hacer parte.
        ¿Te animarías a contribuir?
      earth_alt: Planeta d*
      decentralized_alt: Descentralizado
      freedom_alt: Libertad
      keyhole_alt: Cerradura
      aspects_alt: Facetas
      features_alt: Características
      ways_to_help_alt: Maneras para ayudar
    about:
      headline: "¿Cómo funciona diaspora*?"
      byline: diaspora* es fácil de usar. Encuentra cómo.
      menu_title: Acerca de...
      decentralize: "¿Qué es la descentralización?"
      decentralize_ex: 'diaspora* es completamente diferente a la mayoría de las redes
        que has usado: es descentralizada por completo, es decir, no depende de un
        servidor principal. Y, a pesar de ello, es muy fácil poder conectarse y comunicarse
        con otras personas. Mira cómo.'
      this: ESTO SÍ
      this_ex: diaspora* es una verdadera red sin base central. Existen ciertos servidores
        (llamados «cápsulas») repartidos en todo el mundo y cada uno contiene los
        datos de los usuarios que decidieron alojarlos allí. Estas cápsulas se comunican
        entre sí sin interrupciones para que, así, te puedas registrar en cualquier
        cápsula y comunicarte con tus contactos donde sea que se encuentren en la
        red.
      notthis: ESTO NO
      notthis_ex: La mayoría de las redes sociales operan desde servidores que son
        propiedad de una compañía. Esos servidores guardan todos los datos privados
        de sus usuarios y dicha información podría perderse o ser pirateada. Además,
        como cualquier sistema con cuello de botella, un problema en los servidores
        centrales puede ocasionar una lentitud en la red, o que directamente deje
        de funcionar. También podría favorecer que los gobiernos «se filtren dentro».
      discl: "(diaspora* usa los protocolos abiertos de red como %{pubsubhubbub} y
        %{webfinger} para que estos tipos de conexión sean posibles)."
      connect: "¿Cómo me conecto?"
      connect_ex: 'Aunque diaspora* se compone de múltiples cápsulas alrededor de
        todo el mundo, puedes comprobar que funciona tan bien como una red integrada,
        debido al hecho de que no se necesita estar en la misma cápsula que tus contactos
        para comunicarse libremente: la comunicación se lleva a cabo sin interrupciones
        en todas las cápsulas del universo de diaspora*. Incluso, al usar diaspora*,
        olvidarás que está hecha de múltiples cápsulas. De hecho, conectarse con alguien
        en diaspora* es bastante sencillo: '
      find: 1. Encuéntralos
      find_ex: Todo lo que se necesita es encontrar a la persona con la que te quieras
        conectar y agregarlas a una «faceta» (ver más abajo más información sobre
        las facetas). Encuentra a tus amigos usando el campo de búsqueda en la barra
        negra o posa el ratón sobre su nombre en tu fuente y una tarjeta flotante
        aparecerá. Si conoces el identificador de tus amigos en diaspora* (nombre@nombredelacapsula.com),
        puedes encontrarlos con ello.
      add: 2. Agrégalos
      add_ex: 'Ahora es una cuestión de hacer clic en «Agregar contacto» y elegir
        la faceta a la que los quieras agregar. Ahora estarán conectados y podrán
        compartir entre sí como en cualquier otra red social. O, si también hacen
        parte de otras facetas de tu vida, los puedes agregar igualmente a otras facetas.
        Y así de fácil se pueden conectar. '
      freedom: 'Libertad:'
      freedom_byline: diaspora* no quiere limtarte
      fdm1: Sé quién quieras ser
      fdm1_ex: Muchas redes piden usar tu identidad real. En diaspora* no. Aquí podemos
        elegir quiénes queremos ser y compartir de nuestra vida solo lo que queramos.
        Es tu decisión hasta dónde interactuar con otras personas
      fdm2: Usa tu creatividad
      fdm2_ex: 'No hay limitaciones a cómo interactuar. Puedes seguir fascinantes
        personas y ver lo que tienen por decir o puedes compartir el mundo con todos:
        comparte tus fotos, arte, videos, música, palabras; lo que sea que quieras.
        Déjate volar.'
      fdm3: Libre como en libertad
      fdm3_ex: diaspora* es un software completamente libre. Esto quiere decir que
        no hay límites a cómo usarlo. Se puede tomar el código fuente y cambiarlo
        para que funcione a la medida tuya y para que nos ayude a mejorar la red.
        Nos encantaría tenerte a bordo.
      privacy: Privacidad.
      privacy_byline: 'Control total sobre lo que es tuyo '
      priv1: Aduéñate de tus datos
      priv1_ex: Muchas redes obtienen beneficios utilizando tus interacciones para
        mostrarte publicidad. En diaspora* no se usan tus datos de ninguna manera
        que no sea para conectarte y que compartas con otros. Las únicas personas
        con acceso a tus datos son los administradores de las cápsulas con las que
        interactúas, y puedes elegir con cuáles cápsulas interactuar.
      priv2: Alójalo tú mismo
      priv2_ex: Elige dónde se almacenan tus datos eligiendo una cápsula de tu agrado.
        Si quieres estar seguro de verdad, puedes configurar una cápsula propia con
        servidores bajo tu control e interactuar con cápsulas en las que confíes para
        que nadie pueda llegar a tus datos personales.
      priv3: Elige tu público
      priv3_ex: 'Las facetas de diaspora* permiten compartir solo con aquellos que
        quieras y de manera tan pública o privada como te guste. Desde compartir una
        divertida foto con todo el mundo hasta un secreto con tus amigos más cercanos:
        tú eres quien tiene el control.'
      aspects: 'Todo sobre las facetas:'
      aspects_byline: la clave de la privacidad en diaspora*
      asp1: Las facetas de tu vida
      asp1_ex: La vida está hecha de muchas facetas distintas con personas distintas.
        ¿Por qué debería ser distinta la vida en línea? Con las facetas de diaspora*
        se puede organizar la vida en línea tanto como quieras y compartiendo solo
        con aquellos que prefieras.
      asp2: Organiza tu vida
      asp2_ex: Por ejemplo, es muy probable que tengas una faceta distinta con tu
        familia, amigos más cercanos, compañeros del trabajo y para los deportes o
        pasatiempos que disfrutes. De hecho, los compañeros del trabajo no tienen
        por qué saber de tus reuniones familiares, ¿verdad? Pues con las facetas de
        diaspora*, no lo sabrán.
      asp3: Díselo al mundo entero
      asp3_ex: Claro que sí, algunas cosas son tan importantes que hay que compartirlas
        con el mundo entero, y lo podrás hacer si las subes como públicas. Así que,
        usando las etiquetas apropiadas, tus publicaciones llegarán a las personas
        que más lo disfrutarían.
      features: Características que nuestra comunidad ama
      features_byline: y que creemos que tú también
      hashtags: Etiquetas
      hashtags_ex: Las etiquetas permiten marcar y seguir tus intereses y ayudan a
        tus publicaciones a llegar a la gente como tú. Por otro lado, son una excelente
        manera de conocer gente divertida e interesante en diaspora*.
      reshare: Comparte
      reshare_ex: "¿Por qué no compartir una publicación encantadora con tus círculos?
        diaspora* facilita el difundir las ideas al compartir. Solo hay que presionar
        un botón para compartir la palabra."
      mentions: Menciones
      mentions_ex: "¿Quieres obtener la atención de alguien? No es sino usar un @
        y ¡listo! Es una manera fácil de informarle a uno de tus contactos de algo
        que consideres que necesiten saber."
      love: Amor
      love_ex: Muestra cuánto aprecias lo que te encanta con ♥. A veces las palabras
        no bastan para decir lo que sientes.
      host: Aloja una cápsula para la comunidad
      host_byline: Sé una de las estrellas de diaspora*
      host_ex: diaspora* depende de los miembros de su comunidad para alojar y operar
        las cápsulas, las cuales están abiertos para quien quiera hacer parte. Si
        tienes algo de espacio en tus servidores y un poco de conocimiento técnico,
        nos encantaría que configuraras una cápsula que esté abierta para que la usáramos.
        Mientras más cápsulas haya, mejor funcionará diaspora*. ¡Sé parte del futuro
        de una red social decentralizada!
      hostinst1: Lee %{instructions_link} y configura tu propia cápsula de la comunidad.
      instructions_link_text: Instrucciones para la instalación de una cápsula
      hostinst2: Mira la lista de las cápsulas de la comunidad en %{poduptime}.
      distributed_network: Red distribuida
      centralized_network:
      search_alt: Buscar
      add_a_contact_alt: Añadir un contacto
      hashtag_alt: Etiqueta
      reshare_alt: Compartir
      mention_alt: Mencionar
      heart_alt: Corazón
    get_involved:
      headline: "¡Participa!"
      byline: El futuro de la red social empieza contigo.
      menu_title: Participa
      community: Hecho posible por la comunidad.
      community_byline: diaspora* te pertenece
      meaning: "¿Qué significa todo esto?"
      meaning_ex1: Los programas libres se tratan de individualidad, transparencia,
        creatividad y destino. Son acerca de tener una idea y hacerla realidad. diaspora*
        se fundó para satisfacer la pasión por la diversión y hacer del Internet un
        lugar mejor. Y son los programas libres los que nos permiten moldear el mundo
        a nosotros y que los amigos a lo largo de la red se beneficien de nuestra
        exploración.
      meaning_ex2: Las comunidades de los programas libres son cosas asombrosas y,
        en diaspora*, creemos que a la gente de las comunidades se le debe valorar
        por lo que hace. No importa si alguien es un programador de élite o si nunca
        ha colaborado en un proyecto porque contribuir en diaspora* significa trabajar
        en problemas difíciles con la meta de encontrar soluciones para los usuarios.
      meaning_ex3: Por esta razón, si aportas a diaspora* algo significativo, te daremos
        acceso total. Estamos en esto juntos y queremos darle la oportunidad de hacer
        grandes cambios a personas animadas.
      whereyou: Dónde tomas parte
      whereyou_ex1: Entre todos hacemos diaspora*. Puede que no te conozcamos aún,
        pero nos encantaría conocerte y averiguar cómo encajas en el equipo que construye
        el futuro de las redes, pues todos tenemos el potencial de cambiar el mundo
        si se nos da la oportunidad justa.
      whereyou_ex2: Se puede contribuir a diaspora* de muchas maneras, sea reportando
        fallos, enviándonos retroalimentación a nuestros correos o escribiendo el
        código y creando el diseño. De cualquier manera que lo puedas hacer, te necesitamos.
      gi_header: Maneras de involucrarse en diaspora*
      code_header: Contribuye al código
      code_byline: Participar en el código es muy fácil
      code_ex1: 'Copia el repositorio y curiosea: %{clone_code}'
      code_ex2: Instala también tu propio entorno de desarrollo.
      code_ex3: "¡Danos una mano con el código!"
      code_ex4: 'Tenemos una gran comunidad lista para ayudarte a ayudarnos. Puedes
        comenzar revisando la guía para principiantes: %{get_started_guide_link}.
        También puedes discutir con nosotros aquí: %{discourse_link}, y conocernos
        mejor aquí: %{irc_link}.'
      get_started_guide_link_text: Guía para comenzar
      discourse_link_text:
      irc_link_text: Salas IRC de diaspora*
      code_gh: Ver el código fuente en GitHub
      bugs_header: Manejo de fallos
      bugs_ex1: 'El proyecto usa Code Triage: un servicio de voluntariado donde los
        usuarios y desarrolladores colaboran para resolver fallos en %{github_link}.'
      bugs_ex2: Arreglar los fallos ayuda a todo el mundo y le da a los nuevos usuarios
        un mejor acercamiento de cómo funcionan las diferentes partes de diaspora*.
      bugs_ex3: Ayúdanos a limpiar el código
      github_link_text:
      translate_header: Ayuda a traducir
      translate_ex1: 'Traduce diaspora* uniéndote aquí: %{translations_link}.'
      translations_link_text: Grupo de traducción
      translate_ex2: 'Lee las instrucciones de traducción para saber cómo empezar
        aquí: %{translation_instructions_link}.'
      translation_instructions_link_text: 'instrucciones de traducción '
      voice_header: Aporta tu voz
      voice_ex1: Como el proyecto se lleva a cabo por una comunidad de voluntarios,
        usamos una herramienta llamada Discourse que ayuda a enfrascarse en conversaciones
        con los colaboradores y compartir ideas y sugerencias.
      voice_ex2: Únetenos aquí.
      voice_ex3: Convence a tus amigos y familiares a unirse a diaspora* organizando
        tu propio %{meetup_link} en la vida real con tu comunidad.
      meetup_link_text: encuentro en Meetup
      support_header: Proporciona soporte
      support_ex1: "¡Ayuda a los nuevos usuarios a sentirse bienvenidos!"
      support_ex2: Regístrate aquí.
      support_ex3: Escribe manuales de usuario en %{tutorials_link}.
      support_ex4: Responde las preguntas de los usuarios en %{irc_channel_link} o
        en diaspora* directamente siguiendo las etiquetas <span class="click">#ayuda</span>,
        <span class="click">#pregunta</span> y <span class="click">#sugerencia</span>.
      irc_channel_link_text: canal IRC
      support_ex5: Contribuye a la %{wiki_link}.
      wiki_link_text:
      run_header: Aloja una cápsula pública
      run_ex1: "¡Ahora no tienes por qué resignarte a tener tus datos en un servidor
        ajeno! Como diaspora* es un software completamente libre, trabajamos sin parar
        para facilitar el %{host_pod_link}."
      host_pod_link_text:
      run_ex2: Puedes alojarlo donde sea.
      run_ex3: Agrega tu cápsula a la lista de cápsulas abiertas en %{poduptime}.
      contributors_header: 'Colaboradores de diaspora*:'
      contributors_byline: las personas que hacen diaspora*.
